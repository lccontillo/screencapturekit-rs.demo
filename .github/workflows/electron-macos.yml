name: Electron macOS CI & Screenshot

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    name: Build & Screenshot on macOS
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Build ScreenCaptureKit Rust binary
        run: cargo build --release

      - name: Upload Rust Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-screen-recorder-binary-arm64
          path: target/release/macos-screen-recorder
          if-no-files-found: error

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Launch Electron & Capture App Screenshot
        run: npm run screenshot

      - name: Capture Full macOS Runner Desktop
        run: screencapture -x runner-desktop.png || true

      - name: Test Headless Screen Recording Execution
        run: |
          echo "Attempting test headless recording with compiled binary..."
          ./target/release/macos-screen-recorder --duration 3 --output ci-recording.mp4 || echo "Headless recording note: macOS TCC permissions restricted as expected on hosted runner."

      - name: Upload Screenshots & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos-artifacts
          path: |
            screenshot.png
            runner-desktop.png
            ci-recording.mp4
          if-no-files-found: warn
